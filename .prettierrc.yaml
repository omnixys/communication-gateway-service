# ============================================================
# 🧩 Prettier-Konfiguration für TypeScript + Node + NestJS
# ------------------------------------------------------------
# Ziel: Einheitlicher Stil, maximale Lesbarkeit, CI/CD-kompatibel
# ============================================================

# ───────────────────────────────
# 🌍 Allgemeine Formatregeln
# ───────────────────────────────
singleQuote: true
semi: true
trailingComma: all
tabWidth: 2
printWidth: 80
endOfLine: lf
bracketSpacing: true
arrowParens: always
quoteProps: as-needed
proseWrap: preserve

# ───────────────────────────────
# 📦 Import-Sortierung
# ───────────────────────────────
plugins:
  - prettier-plugin-organize-imports
  - prettier-plugin-sort-imports

sortingMethod: alphabetical

# ───────────────────────────────
# ⚙️ Overrides für bestimmte Dateitypen
# ───────────────────────────────
overrides:
  - files: ['*.ts', '*.tsx', '*.js']
    options:
      tabWidth: 2
      trailingComma: all
      singleQuote: true
      semi: true

  - files: ['*.json', '*.yaml', '*.yml', '*.md']
    options:
      tabWidth: 2
      printWidth: 80
      proseWrap: preserve

  - files: '*.prisma'
    options:
      tabWidth: 2
      printWidth: 80
      trailingComma: es5

  - files: ['*.module.ts', '*.controller.ts', '*.service.ts']
    options:
      tabWidth: 2
      printWidth: 100
