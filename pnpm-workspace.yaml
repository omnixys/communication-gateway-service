# 🧱 pnpm-Workspace-Konfiguration für den Omnixys Communication Gateway
# ---------------------------------------------------------------------------------------

allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  cpu-features: true
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@omnixys/contracts-ts@4.0.0 || 4.1.0 || 4.4.0 || 4.5.0'
  - '@omnixys/context-ts@4.0.2 || 4.0.3 || 4.1.0 || 4.1.1'
  - '@omnixys/kafka-ts@4.0.0 || 4.1.0 || 4.2.0 || 4.3.1'
  - '@omnixys/logger-ts@4.0.0 || 4.1.0 || 4.1.1 || 4.2.0'
  - '@omnixys/observability-ts@4.0.0 || 4.1.0 || 4.1.1'
overrides:
  '@nestjs/apollo@13.4.5>@apollo/server-plugin-landing-page-graphql-playground': '-'
  fastify: 5.8.5
patchedDependencies:
  '@nestjs/apollo@13.4.5': patches/nest-apollo-13.4.5.patch
