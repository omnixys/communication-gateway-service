# 🧱 pnpm-Workspace-Konfiguration für den Omnixys Communication Gateway
# ---------------------------------------------------------------------------------------

packages:
  - .

allowBuilds:
  '@apollo/protobufjs': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@omnixys/contracts-ts@4.0.0 || 4.1.0 || 4.4.0 || 4.5.0'
  - '@omnixys/kafka-ts@4.0.0 || 4.1.0 || 4.2.0 || 4.3.1'
  - '@omnixys/logger-ts@4.0.0 || 4.1.0 || 4.1.1 || 4.2.0'

overrides:
  fastify: 5.8.5
